<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Scavenge Editor</title>
<link rel="stylesheet" href="/dev_css/shared.css">
<style>
body { user-select: none; }

/* ── Toolbar ── */
#toolbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 6px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
#toolbar h1 { font-size: 13px; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
#toolbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#toolbar select { max-width: 160px; }
.tb-sep   { width: 1px; background: var(--border); align-self: stretch; margin: 2px 2px; }
.tb-space { flex: 1; }
#saveStatus { font-size: 11px; min-width: 120px; }
#saveStatus.saved   { color: var(--green); }
#saveStatus.unsaved { color: var(--yellow); }

/* ── Main layout ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: 268px; flex-shrink: 0;
  background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-hd {
  padding: 5px 10px; font-size: 10px; color: var(--muted);
  letter-spacing: .08em; text-transform: uppercase;
  background: var(--bg4); border-bottom: 1px solid var(--border); flex-shrink: 0;
}

/* Object list */
#obj-list { max-height: 192px; overflow-y: auto; flex-shrink: 0; }
.obj-row {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px; cursor: pointer;
  border-bottom: 1px solid var(--border); font-size: 12px;
}
.obj-row:hover { background: var(--bg3); }
.obj-row.sel   { background: var(--bg3); border-left: 2px solid var(--accent); }
.obj-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.obj-id   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.obj-type { font-size: 10px; color: var(--muted); white-space: nowrap; }
.obj-del  { margin-left: 4px; color: var(--accent); opacity: 0; padding: 0 3px; cursor: pointer; font-size: 14px; line-height: 1; }
.obj-row:hover .obj-del { opacity: 1; }
.obj-empty { padding: 8px 10px; color: var(--muted); font-size: 11px; }

.add-row {
  display: flex; gap: 6px; padding: 6px 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.add-row select { flex: 1; }
.add-row .btn { padding: 3px 10px; font-size: 11px; white-space: nowrap; }

/* Sidebar tabs */
.sb-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.sb-tab  { flex: 1; padding: 6px 4px; background: none; border: none; color: #666; cursor: pointer; font-family: monospace; font-size: 10px; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: .06em; }
.sb-tab:hover { color: #aaa; }
.sb-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
#panel-objects { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
#panel-scene   { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#scene-meta-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

/* Properties */
#props-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
#props-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 7px; }

/* Scene meta */
.sm-sec { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; padding: 4px 0 2px; border-bottom: 1px solid var(--border); }
.sm-card { background: var(--bg3); border: 1px solid var(--border); padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
.sm-card-hd { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); font-weight: bold; cursor: pointer; }
.sm-card-id  { flex: 1; }
.sm-card-del { color: var(--accent); cursor: pointer; font-size: 15px; line-height: 1; }
.sm-card-del:hover { color: #ff9999; }
.sm-field { display: flex; flex-direction: column; gap: 2px; }
.sm-field label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.sm-field input, .sm-field textarea { width: 100%; }
.sm-field textarea { height: 48px; resize: vertical; }
.sm-add { font-size: 11px; padding: 3px 10px; margin-top: 2px; }

.pr { display: flex; flex-direction: column; gap: 2px; }
.pr > .fl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1px; }
.pr input, .pr select, .pr textarea { width: 100%; }
.pr textarea { height: 54px; resize: vertical; }
.pr-row { display: flex; gap: 6px; }
.pr-row .pr { flex: 1; }
.pr-ck { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.pr-ck label { font-size: 12px; color: var(--text); cursor: pointer; }
.pr-ck input { width: auto; }
.pr-sec {
  font-size: 10px; color: var(--accent); text-transform: uppercase;
  letter-spacing: .08em; padding-top: 6px; margin-top: 2px;
  border-top: 1px solid var(--border);
}
.pr-note { font-size: 11px; color: var(--muted); }
.pr-req { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
.pr-req label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; color: var(--text); }
.pr-req input  { width: auto; }
.pr-empty { color: var(--muted); font-size: 11px; }

/* ── Canvas ── */
#canvas-wrap {
  flex: 1; min-width: 0;
  overflow-x: auto; overflow-y: hidden;
  background: #050810;
  scrollbar-width: thin; scrollbar-color: var(--border) #050810;
}
#canvas {
  position: relative; height: 100%;
  display: inline-block; cursor: crosshair;
}
#bg-img {
  display: block; height: 100%; width: auto;
  pointer-events: none; -webkit-user-drag: none;
}
#empty-msg {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted); gap: 6px; pointer-events: none;
}
#empty-msg.hidden { display: none; }
#empty-msg .em-t { font-size: 15px; color: var(--muted); }
#empty-msg .em-s { font-size: 11px; }

/* ── Zones ── */
.zone {
  position: absolute; box-sizing: border-box; border: 2px solid;
  cursor: move; overflow: hidden;
}
.zone.sel { outline: 2px solid #fff; outline-offset: 1px; z-index: 10; }
.zone[data-t=item]    { border-color: #f0a500; background: rgba(240,165,0,.06); }
.zone[data-t=examine] { border-color: #4a9eff; background: rgba(74,158,255,.06); }
.zone[data-t=exit]    { border-color: #3dff7a; background: rgba(61,255,122,.04); }
.zone[data-t=npc]     { border-color: #c060ff; background: rgba(192,96,255,.06); }
.zone-lbl {
  position: absolute; top: 2px; left: 4px;
  font: bold 10px monospace; color: #fff;
  text-shadow: 0 0 4px #000, 0 0 4px #000;
  pointer-events: none; white-space: nowrap;
  max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis;
}
.zone-sprite {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; pointer-events: none;
}

/* Resize handles */
.rh {
  position: absolute; width: 10px; height: 10px;
  background: #fff; border: 1px solid #444; border-radius: 2px; z-index: 20;
}
.rh.nw { top:-5px;  left:-5px;  cursor:nw-resize; }
.rh.n  { top:-5px;  left:calc(50% - 5px); cursor:n-resize; }
.rh.ne { top:-5px;  right:-5px; cursor:ne-resize; }
.rh.e  { top:calc(50% - 5px); right:-5px; cursor:e-resize; }
.rh.se { bottom:-5px; right:-5px; cursor:se-resize; }
.rh.s  { bottom:-5px; left:calc(50% - 5px); cursor:s-resize; }
.rh.sw { bottom:-5px; left:-5px; cursor:sw-resize; }
.rh.w  { top:calc(50% - 5px); left:-5px; cursor:w-resize; }

/* ── Info bar ── */
#infobar {
  height: 22px; flex-shrink: 0;
  background: var(--bg4); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 24px;
  font-size: 11px; color: var(--muted);
}
</style>
</head>
<body>
<script src="/dev_js/nav.js"></script>

<div id="toolbar">
  <h1>👁 SCAVENGE</h1>
  <div class="tb-sep"></div>
  <label>Сцена
    <select id="scene-sel">
      <option value="">— выбрать —</option>
    </select>
  </label>
  <button class="btn" id="btn-new">+ Новая</button>
  <div class="tb-sep"></div>
  <label id="bg-label" style="display:none">Фон
    <select id="bg-sel"></select>
  </label>
  <div class="tb-space"></div>
  <button class="btn green" id="btn-save" disabled>💾 Сохранить</button>
  <span id="saveStatus"></span>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sb-tabs">
      <button class="sb-tab active" data-panel="objects">Объекты</button>
      <button class="sb-tab" data-panel="scene">Сцена</button>
    </div>

    <div id="panel-objects">
      <div id="obj-list"></div>
      <div class="add-row" id="add-row" style="display:none">
        <select id="new-type">
          <option value="examine">examine</option>
          <option value="item">item</option>
          <option value="exit">exit</option>
          <option value="npc">npc</option>
        </select>
        <button class="btn" id="btn-add">+ Добавить</button>
      </div>
      <div id="props-panel">
        <div class="sb-hd">Свойства</div>
        <div id="props-scroll">
          <div class="pr-empty">Выберите объект</div>
        </div>
      </div>
    </div>

    <div id="panel-scene" style="display:none">
      <div id="scene-meta-scroll">
        <div class="pr-empty">Выберите сцену</div>
      </div>
    </div>
  </div>

  <div id="canvas-wrap">
    <div id="canvas">
      <img id="bg-img" draggable="false" alt="">
      <div id="empty-msg">
        <div class="em-t">Scavenge Editor</div>
        <div class="em-s">Выберите или создайте сцену</div>
        <div class="em-s" style="margin-top:6px">Дабл-клик — добавить зону · Del — удалить · Ctrl+S — сохранить · ← → ↑ ↓ — сдвиг</div>
      </div>
    </div>
  </div>
</div>

<div id="infobar">
  <span id="ib-xy">X: —  Y: —</span>
  <span id="ib-scale">Scale: —</span>
  <span id="ib-scene">—</span>
</div>

<script src="/dev_js/scavenge_editor.js"></script>
</body>
</html>
