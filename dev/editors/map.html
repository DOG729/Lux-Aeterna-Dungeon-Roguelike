<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Map Constructor</title>
<link rel="stylesheet" href="/dev_css/shared.css">
<style>
/* Map-specific overrides (no flex body column from shared — we need full layout) */
body { user-select: none; }

/* ── Toolbar ── */
#toolbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 6px 14px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#toolbar h1 { font-size: 13px; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
#toolbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
#toolbar input[type=number] { width: 52px; }
#toolbar select { max-width: 170px; }
#statusMsg { font-size: 11px; color: var(--green); margin-left: 4px; min-width: 160px; }
#hint { font-size: 10px; color: #555; margin-left: auto; white-space: nowrap; }

/* ── Layout ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Palette ── */
#palette { width: 210px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.pal-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.pal-tab { flex: 1; padding: 7px 2px; background: none; border: none; color: #666; cursor: pointer; font-family: monospace; font-size: 10px; border-bottom: 2px solid transparent; transition: color .15s; }
.pal-tab:hover { color: #aaa; }
.pal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
#paletteList { flex: 1; overflow-y: auto; padding: 4px; }
.palette-item { display: flex; align-items: center; gap: 7px; padding: 5px 6px; cursor: pointer; border: 1px solid transparent; border-radius: 2px; margin-bottom: 2px; }
.palette-item:hover { background: var(--bg3); }
.palette-item.active { border-color: var(--accent); background: var(--bg3); }
.palette-item.dimmed { opacity: 0.4; }
.palette-img { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; background: var(--bg4); }
.palette-info { flex: 1; overflow: hidden; }
.palette-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette-sub  { font-size: 9px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.rec-badge { color: var(--green); }

/* ── Map canvas ── */
#mapWrap   { flex: 1; overflow: auto; background: #0d1117; position: relative; }
#mapCanvas { position: relative; min-width: 100%; min-height: 100%; }

/* ── Cells ── */
.cell { position: absolute; width: 100px; height: 100px; }
.cell-empty { cursor: pointer; }
.cell-empty-inner { position: absolute; inset: 4px; display: flex; align-items: center; justify-content: center; color: #ffffff18; font-size: 22px; border: 1px dashed #ffffff10; transition: .15s; }
.cell-empty:hover .cell-empty-inner { color: #ffffff55; border-color: #ffffff30; background: #ffffff05; }
.cell-room { cursor: pointer; border: 2px solid #ffffff18; transition: border-color .1s; }
.cell-room:hover { border-color: #ffffff44; }
.cell-room.sel { border-color: var(--accent) !important; box-shadow: 0 0 0 1px #e9456088; }
.room-img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; pointer-events: none; }
.room-bg  { width: 100%; height: 100%; background: var(--bg3); display: block; }

.badge { position: absolute; font-size: 9px; padding: 1px 4px; pointer-events: none; }
.badge-type { top: 2px; left: 2px; background: #e9456099; color: #fff; }
.badge-mob  { bottom: 2px; left: 2px; background: #ff6b6b99; color: #fff; }
.badge-npc  { top: 2px; right: 2px; background: #ffd16699; color: #111; }
.badge-obj  { bottom: 2px; right: 2px; background: #4ecca399; color: #111; }
.badge-evt  { top: 22px; right: 2px; background: #8b5cf699; color: #fff; }

/* ── Passage toggles ── */
.psg { position: absolute; z-index: 5; cursor: pointer; opacity: 0.7; transition: opacity .15s; }
.psg:hover { opacity: 1; }
.psg.h { height: 7px; left: 25%; width: 50%; }
.psg.v { width: 7px; top: 25%; height: 50%; }
.psg.top    { top: -3px; }
.psg.bottom { bottom: -3px; }
.psg.left   { left: -3px; }
.psg.right  { right: -3px; }
.psg.open   { background: #4ecca3cc; }
.psg.closed { background: #ff6b6b44; }

/* ── Inspector ── */
#inspector { width: 230px; background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; padding: 10px 8px; flex-shrink: 0; }
#inspector h3 { font-size: 12px; color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
.iblock { margin-bottom: 10px; }
.ilabel { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
.ivalue { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); background: #0d1117; padding: 4px 6px; border-radius: 2px; min-height: 28px; }
.ivalue img { width: 20px; height: 20px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
.iremove { margin-left: auto; cursor: pointer; color: #ff6b6b; font-size: 16px; line-height: 1; flex-shrink: 0; }
.iremove:hover { color: #ff9999; }
.iempty { font-size: 10px; color: #444; font-style: italic; padding: 2px 0; }
.ilist { display: flex; flex-direction: column; gap: 2px; }
.psg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.psg-chk  { display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; }
.psg-chk input { cursor: pointer; accent-color: var(--green); }
.iselect { width: 100%; background: #0d1117; border: 1px solid #334; color: var(--text); padding: 4px 6px; font-family: monospace; font-size: 11px; cursor: pointer; }
.inone { color: #555; font-size: 10px; text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<script src="/dev_js/nav.js"></script>

<div id="toolbar">
  <h1>⚔ MAP CONSTRUCTOR</h1>
  <label>Уровень: <input type="number" id="levelInput" min="1" max="15" value="1"></label>
  <select id="planSelect"><option value="">-- план --</option></select>
  <button class="btn" id="loadPlanBtn">📂 Загрузить</button>
  <button class="btn" id="savePlanBtn">💾 Сохранить</button>
  <button class="btn" id="generateBtn">🎲 Генерировать</button>
  <button class="btn green" id="exportBtn">↓ Export JSON</button>
  <button class="btn danger" id="clearBtn">✕ Очистить</button>
  <span id="statusMsg"></span>
  <span id="hint">ЛКМ = выбрать/разместить · ПКМ = удалить · клик ▮ = переключить проход</span>
</div>

<div id="main">
  <div id="palette">
    <div class="pal-tabs">
      <button class="pal-tab active" data-tab="sections">Секции</button>
      <button class="pal-tab" data-tab="mobs">Мобы</button>
      <button class="pal-tab" data-tab="npcs">NPC</button>
      <button class="pal-tab" data-tab="objects">Объекты</button>
    </div>
    <div id="paletteList"></div>
  </div>
  <div id="mapWrap"><div id="mapCanvas"></div></div>
  <div id="inspector"><p class="inone">Выберите комнату</p></div>
</div>

<script type="module" src="/dev_js/map_editor.js"></script>
</body>
</html>
